<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCore — Audit Logs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="../shared/api.js"></script><script src="../shared/auth.js"></script><script src="../shared/components.js"></script>
    <style>
        body{font-family:'DM Sans',sans-serif;background:#0B0F1A;color:#e8eef8}h1,h2,h3{font-family:'Syne',sans-serif}.sidebar{background:#111827;border-right:1px solid rgba(141,163,194,0.1);width:260px;min-height:100vh;padding:1.5rem 1rem;display:flex;flex-direction:column;position:fixed;left:0;top:0;z-index:40}.sidebar-nav{flex:1;display:flex;flex-direction:column;gap:4px;margin-top:2rem}.nav-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;color:#8da3c2;text-decoration:none;font-size:14px;transition:all 0.2s}.nav-item:hover{background:rgba(0,212,170,0.08);color:#e8eef8}.nav-item.active{background:rgba(0,212,170,0.12);color:#00d4aa}.nav-item i{width:20px;height:20px}.logo{display:flex;align-items:center;gap:10px}.logo-icon{color:#00d4aa;width:32px;height:32px}.logo-text{font-family:'Syne';font-size:1.25rem;font-weight:700;background:linear-gradient(135deg,#00d4aa,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.sidebar-footer{border-top:1px solid rgba(141,163,194,0.1);padding-top:1rem}.logout-btn{color:#ef4444!important}.logout-btn:hover{background:rgba(239,68,68,0.1)!important}.main-content{margin-left:260px;padding:2rem}.glass-card{background:#131c2e;border:1px solid rgba(141,163,194,0.08);border-radius:1rem}.input-field{background:rgba(11,15,26,0.6);border:1px solid rgba(141,163,194,0.15);color:#e8eef8}.input-field:focus{border-color:#00d4aa;outline:none}
    </style>
</head>
<body x-data="auditPage()" x-init="init()">
    <div x-html="getSidebar('admin', 'audit-logs')"></div>
    <main class="main-content">
        <h1 class="text-2xl font-bold mb-2">Audit Logs</h1>
        <p class="text-[#8da3c2] text-sm mb-6">Every API action is traced and logged</p>
        <div class="flex gap-3 mb-6">
            <input x-model="filterAction" @input.debounce.300ms="loadLogs()" placeholder="Filter by action..." class="input-field px-3 py-2 rounded-xl text-sm w-64">
            <div class="flex gap-2 ml-auto">
                <button @click="page>1&&(page--,loadLogs())" class="px-3 py-2 rounded-xl text-sm bg-[#131c2e] border border-[#1e293b] text-[#8da3c2] hover:border-teal-500/30">← Prev</button>
                <span class="px-3 py-2 text-sm text-[#4a6288]">Page <span x-text="page"></span></span>
                <button @click="page++; loadLogs()" class="px-3 py-2 rounded-xl text-sm bg-[#131c2e] border border-[#1e293b] text-[#8da3c2] hover:border-teal-500/30">Next →</button>
            </div>
        </div>
        <div class="glass-card overflow-hidden">
            <table class="w-full text-sm">
                <thead><tr class="border-b border-[#1e293b]">
                    <th class="text-left p-4 text-[#4a6288] font-medium">Time</th>
                    <th class="text-left p-4 text-[#4a6288] font-medium">Actor</th>
                    <th class="text-left p-4 text-[#4a6288] font-medium">Action</th>
                    <th class="text-left p-4 text-[#4a6288] font-medium">Resource</th>
                    <th class="text-left p-4 text-[#4a6288] font-medium">IP</th>
                </tr></thead>
                <tbody>
                    <template x-for="log in logs" :key="log.id">
                        <tr class="border-b border-[#1e293b]/50 hover:bg-[#0B0F1A]/30">
                            <td class="p-4 text-xs text-[#4a6288]" x-text="formatDateTime(log.created_at)"></td>
                            <td class="p-4"><span class="text-xs" x-text="log.actor_type||'system'"></span> <span class="text-[#8da3c2]" x-text="log.actor_id?'#'+log.actor_id:''"></span></td>
                            <td class="p-4 font-mono text-xs text-teal-400" x-text="log.action"></td>
                            <td class="p-4 text-xs text-[#8da3c2]" x-text="log.resource_type||'—'"></td>
                            <td class="p-4 text-xs text-[#4a6288]" x-text="log.ip_address||'—'"></td>
                        </tr>
                    </template>
                </tbody>
            </table>
            <p x-show="logs.length===0" class="text-center text-[#4a6288] py-12">No audit logs found</p>
        </div>
    </main>
    <script>
        function auditPage(){
            return{
                logs:[],page:1,filterAction:'',
                async init(){guardRoute(['admin']);await this.loadLogs();this.$nextTick(()=>lucide.createIcons());},
                async loadLogs(){try{let url=`/api/admin/audit-logs?page=${this.page}&limit=50`;if(this.filterAction)url+=`&action=${this.filterAction}`;this.logs=await apiGet(url)||[];}catch(e){}}
            };
        }
    </script>
</body>
</html>
