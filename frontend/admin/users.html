<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCore — User Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="../shared/api.js"></script><script src="../shared/auth.js"></script><script src="../shared/components.js"></script>
    <style>
        body{font-family:'DM Sans',sans-serif;background:#0B0F1A;color:#e8eef8}h1,h2,h3{font-family:'Syne',sans-serif}.sidebar{background:#111827;border-right:1px solid rgba(141,163,194,0.1);width:260px;min-height:100vh;padding:1.5rem 1rem;display:flex;flex-direction:column;position:fixed;left:0;top:0;z-index:40}.sidebar-nav{flex:1;display:flex;flex-direction:column;gap:4px;margin-top:2rem}.nav-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;color:#8da3c2;text-decoration:none;font-size:14px;transition:all 0.2s}.nav-item:hover{background:rgba(0,212,170,0.08);color:#e8eef8}.nav-item.active{background:rgba(0,212,170,0.12);color:#00d4aa}.nav-item i{width:20px;height:20px}.logo{display:flex;align-items:center;gap:10px}.logo-icon{color:#00d4aa;width:32px;height:32px}.logo-text{font-family:'Syne';font-size:1.25rem;font-weight:700;background:linear-gradient(135deg,#00d4aa,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.sidebar-footer{border-top:1px solid rgba(141,163,194,0.1);padding-top:1rem}.logout-btn{color:#ef4444!important}.logout-btn:hover{background:rgba(239,68,68,0.1)!important}.main-content{margin-left:260px;padding:2rem}.glass-card{background:#131c2e;border:1px solid rgba(141,163,194,0.08);border-radius:1rem}.input-field{background:rgba(11,15,26,0.6);border:1px solid rgba(141,163,194,0.15);color:#e8eef8}.input-field:focus{border-color:#00d4aa;outline:none}
    </style>
</head>
<body x-data="usersPage()" x-init="init()">
    <div x-html="getSidebar('admin', 'users')"></div>
    <main class="main-content">
        <div class="flex items-center justify-between mb-8">
            <div><h1 class="text-2xl font-bold">User Management</h1><p class="text-[#8da3c2] text-sm mt-1">Manage all system users</p></div>
            <button @click="showCreate=!showCreate" class="px-4 py-2.5 rounded-xl text-sm font-medium bg-gradient-to-r from-teal-500 to-blue-500 text-white hover:shadow-lg transition-all"><i data-lucide="user-plus" class="w-4 h-4 inline mr-1"></i> Add User</button>
        </div>
        <!-- Create Form -->
        <div x-show="showCreate" x-transition class="glass-card p-6 mb-6">
            <h3 class="font-semibold mb-4">Create New User</h3>
            <form @submit.prevent="createUser()" class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <input x-model="newUser.full_name" placeholder="Full Name" required class="input-field px-3 py-2.5 rounded-xl text-sm">
                <input x-model="newUser.email" type="email" placeholder="Email" required class="input-field px-3 py-2.5 rounded-xl text-sm">
                <input x-model="newUser.password" type="password" placeholder="Password" required class="input-field px-3 py-2.5 rounded-xl text-sm">
                <select x-model="newUser.role" class="input-field px-3 py-2.5 rounded-xl text-sm">
                    <option value="patient">Patient</option><option value="doctor">Doctor</option><option value="lab_tech">Lab Tech</option><option value="admin">Admin</option>
                </select>
                <div class="col-span-full"><button type="submit" class="px-6 py-2.5 rounded-xl text-sm bg-teal-500 text-[#0B0F1A] font-medium hover:bg-teal-400 transition-all">Create</button></div>
            </form>
        </div>
        <!-- Users Table -->
        <div class="glass-card overflow-hidden">
            <table class="w-full text-sm">
                <thead><tr class="border-b border-[#1e293b]">
                    <th class="text-left p-4 text-[#4a6288] font-medium">ID</th>
                    <th class="text-left p-4 text-[#4a6288] font-medium">Name</th>
                    <th class="text-left p-4 text-[#4a6288] font-medium">Email</th>
                    <th class="text-left p-4 text-[#4a6288] font-medium">Role</th>
                    <th class="text-left p-4 text-[#4a6288] font-medium">Phone</th>
                    <th class="text-left p-4 text-[#4a6288] font-medium">Joined</th>
                </tr></thead>
                <tbody>
                    <template x-for="u in users" :key="u.id">
                        <tr class="border-b border-[#1e293b]/50 hover:bg-[#0B0F1A]/30">
                            <td class="p-4 text-[#4a6288]" x-text="u.id"></td>
                            <td class="p-4 font-medium" x-text="u.full_name"></td>
                            <td class="p-4 text-[#8da3c2]" x-text="u.email"></td>
                            <td class="p-4"><span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium" :class="u.role==='admin'?'bg-red-500/20 text-red-400':u.role==='doctor'?'bg-blue-500/20 text-blue-400':u.role==='lab_tech'?'bg-purple-500/20 text-purple-400':'bg-teal-500/20 text-teal-400'" x-text="u.role"></span></td>
                            <td class="p-4 text-[#4a6288]" x-text="u.phone||'—'"></td>
                            <td class="p-4 text-xs text-[#4a6288]" x-text="formatDate(u.created_at)"></td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </main>
    <script>
        function usersPage(){
            return{
                users:[],showCreate:false,newUser:{full_name:'',email:'',password:'',role:'patient',phone:''},
                async init(){guardRoute(['admin']);try{this.users=await apiGet('/api/admin/users')||[];}catch(e){}this.$nextTick(()=>lucide.createIcons());},
                async createUser(){try{await apiPost('/api/admin/users',this.newUser);showToast('User created!');this.showCreate=false;this.newUser={full_name:'',email:'',password:'',role:'patient',phone:''};this.users=await apiGet('/api/admin/users')||[];this.$nextTick(()=>lucide.createIcons());}catch(e){showToast(e.message,'error');}}
            };
        }
    </script>
</body>
</html>
