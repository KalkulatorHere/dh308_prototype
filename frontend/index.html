<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCore — Login</title>
    <meta name="description" content="MediCore Patient-Centric EHR System — Secure login to manage your health records">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="shared/api.js"></script>
    <script src="shared/auth.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: #0B0F1A; color: #e8eef8; min-height: 100vh; }
        h1, h2, h3 { font-family: 'Syne', sans-serif; }

        /* Animated gradient background */
        .bg-animate {
            background: linear-gradient(135deg, #0B0F1A 0%, #111827 40%, #0d1b2a 70%, #0B0F1A 100%);
            position: relative;
            overflow: hidden;
        }
        .bg-animate::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0,212,170,0.05) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(59,130,246,0.05) 0%, transparent 50%);
            animation: bgPulse 8s ease-in-out infinite;
        }
        @keyframes bgPulse {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-5%, 5%); }
        }

        /* Glass card */
        .glass-card {
            background: rgba(19, 28, 46, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(141, 163, 194, 0.1);
            border-radius: 1.5rem;
        }

        /* Glowing input */
        .input-glow {
            background: rgba(11, 15, 26, 0.6);
            border: 1px solid rgba(141, 163, 194, 0.15);
            transition: all 0.3s ease;
        }
        .input-glow:focus {
            border-color: #00d4aa;
            box-shadow: 0 0 0 3px rgba(0, 212, 170, 0.1);
            outline: none;
        }

        /* Primary button glow */
        .btn-primary {
            background: linear-gradient(135deg, #00d4aa, #00b893);
            color: #0B0F1A;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 30px rgba(0, 212, 170, 0.3);
        }
        .btn-primary:active { transform: translateY(0); }

        /* Floating orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: orbFloat 10s ease-in-out infinite;
        }
        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }
    </style>
</head>
<body class="bg-animate min-h-screen flex items-center justify-center p-4" x-data="loginApp()">

    <!-- Decorative orbs -->
    <div class="orb w-96 h-96 bg-teal-500 -top-20 -left-20" style="position:fixed"></div>
    <div class="orb w-80 h-80 bg-blue-500 -bottom-20 -right-20" style="position:fixed; animation-delay: -3s"></div>
    <div class="orb w-64 h-64 bg-purple-500 top-1/2 left-1/3" style="position:fixed; animation-delay: -6s"></div>

    <div class="relative z-10 w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center gap-3 mb-4">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-teal-400 to-blue-500 flex items-center justify-center">
                    <i data-lucide="heart-pulse" class="w-7 h-7 text-white"></i>
                </div>
                <h1 class="text-3xl font-bold bg-gradient-to-r from-teal-400 to-blue-400 bg-clip-text text-transparent">MediCore</h1>
            </div>
            <p class="text-sm text-[#8da3c2]">Patient-Centric Electronic Health Records</p>
        </div>

        <!-- Auth Card -->
        <div class="glass-card p-8">
            <!-- Tab Switcher -->
            <div class="flex mb-8 bg-[#0B0F1A]/50 rounded-xl p-1">
                <button @click="isLogin = true"
                    :class="isLogin ? 'bg-gradient-to-r from-teal-500/20 to-blue-500/20 text-teal-400' : 'text-[#4a6288]'"
                    class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all duration-300">
                    Sign In
                </button>
                <button @click="isLogin = false"
                    :class="!isLogin ? 'bg-gradient-to-r from-teal-500/20 to-blue-500/20 text-teal-400' : 'text-[#4a6288]'"
                    class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all duration-300">
                    Register
                </button>
            </div>

            <!-- Error message -->
            <div x-show="error" x-transition class="mb-4 p-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm">
                <span x-text="error"></span>
            </div>

            <!-- Login Form -->
            <form x-show="isLogin" @submit.prevent="handleLogin()" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-[#8da3c2] mb-2">Email</label>
                    <input x-model="email" type="email" required placeholder="you@example.com"
                        class="input-glow w-full px-4 py-3 rounded-xl text-[#e8eef8] placeholder-[#4a6288]">
                </div>
                <div>
                    <label class="block text-sm font-medium text-[#8da3c2] mb-2">Password</label>
                    <input x-model="password" type="password" required placeholder="••••••••"
                        class="input-glow w-full px-4 py-3 rounded-xl text-[#e8eef8] placeholder-[#4a6288]">
                </div>
                <button type="submit" :disabled="loading"
                    class="btn-primary w-full py-3 rounded-xl text-sm flex items-center justify-center gap-2">
                    <span x-show="!loading">Sign In</span>
                    <span x-show="loading" class="flex items-center gap-2">
                        <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none" opacity="0.25"/><path fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                        Signing in...
                    </span>
                </button>
            </form>

            <!-- Register Form -->
            <form x-show="!isLogin" @submit.prevent="handleRegister()" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-[#8da3c2] mb-2">Full Name</label>
                    <input x-model="fullName" type="text" required placeholder="John Doe"
                        class="input-glow w-full px-4 py-3 rounded-xl text-[#e8eef8] placeholder-[#4a6288]">
                </div>
                <div>
                    <label class="block text-sm font-medium text-[#8da3c2] mb-2">Email</label>
                    <input x-model="email" type="email" required placeholder="you@example.com"
                        class="input-glow w-full px-4 py-3 rounded-xl text-[#e8eef8] placeholder-[#4a6288]">
                </div>
                <div>
                    <label class="block text-sm font-medium text-[#8da3c2] mb-2">Password</label>
                    <input x-model="password" type="password" required placeholder="••••••••" minlength="6"
                        class="input-glow w-full px-4 py-3 rounded-xl text-[#e8eef8] placeholder-[#4a6288]">
                </div>
                <div>
                    <label class="block text-sm font-medium text-[#8da3c2] mb-2">Role</label>
                    <select x-model="role" class="input-glow w-full px-4 py-3 rounded-xl text-[#e8eef8]">
                        <option value="patient">Patient</option>
                        <option value="doctor">Doctor</option>
                        <option value="lab_tech">Lab Technician</option>
                    </select>
                </div>
                <button type="submit" :disabled="loading"
                    class="btn-primary w-full py-3 rounded-xl text-sm flex items-center justify-center gap-2">
                    <span x-show="!loading">Create Account</span>
                    <span x-show="loading" class="flex items-center gap-2">
                        <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none" opacity="0.25"/><path fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                        Creating account...
                    </span>
                </button>
            </form>

            <!-- Demo Credentials -->
            <div class="mt-6 pt-6 border-t border-[#1e293b]">
                <p class="text-xs text-[#4a6288] mb-3">Demo Accounts (password: <code class="text-teal-400">password123</code>)</p>
                <div class="grid grid-cols-2 gap-2">
                    <button @click="quickLogin('rahul@medicore.com')" class="text-xs text-[#8da3c2] hover:text-teal-400 py-1.5 px-3 rounded-lg bg-[#0B0F1A]/40 hover:bg-teal-500/10 transition-all">
                        🧑 Patient
                    </button>
                    <button @click="quickLogin('priya@medicore.com')" class="text-xs text-[#8da3c2] hover:text-teal-400 py-1.5 px-3 rounded-lg bg-[#0B0F1A]/40 hover:bg-teal-500/10 transition-all">
                        👩‍⚕️ Doctor
                    </button>
                    <button @click="quickLogin('neha@medicore.com')" class="text-xs text-[#8da3c2] hover:text-teal-400 py-1.5 px-3 rounded-lg bg-[#0B0F1A]/40 hover:bg-teal-500/10 transition-all">
                        🔬 Lab Tech
                    </button>
                    <button @click="quickLogin('admin@medicore.com')" class="text-xs text-[#8da3c2] hover:text-teal-400 py-1.5 px-3 rounded-lg bg-[#0B0F1A]/40 hover:bg-teal-500/10 transition-all">
                        ⚙️ Admin
                    </button>
                </div>
            </div>
        </div>

        <p class="text-center text-xs text-[#4a6288] mt-6">
            © 2026 MediCore — Patient-Centric Health Data Management
        </p>
    </div>

    <script>
        function loginApp() {
            return {
                isLogin: true,
                email: '',
                password: '',
                fullName: '',
                role: 'patient',
                error: '',
                loading: false,

                init() {
                    // If already logged in, redirect
                    if (isLoggedIn()) {
                        redirectToDashboard();
                    }
                    lucide.createIcons();
                },

                async handleLogin() {
                    this.loading = true;
                    this.error = '';
                    try {
                        const data = await apiPost('/api/auth/login', {
                            email: this.email,
                            password: this.password
                        });
                        if (data) {
                            saveAuth(data);
                            redirectToDashboard();
                        }
                    } catch (e) {
                        this.error = e.message || 'Login failed';
                    }
                    this.loading = false;
                },

                async handleRegister() {
                    this.loading = true;
                    this.error = '';
                    try {
                        const data = await apiPost('/api/auth/register', {
                            full_name: this.fullName,
                            email: this.email,
                            password: this.password,
                            role: this.role
                        });
                        if (data) {
                            saveAuth(data);
                            redirectToDashboard();
                        }
                    } catch (e) {
                        this.error = e.message || 'Registration failed';
                    }
                    this.loading = false;
                },

                quickLogin(email) {
                    this.email = email;
                    this.password = 'password123';
                    this.isLogin = true;
                    this.handleLogin();
                }
            };
        }
    </script>
</body>
</html>
