<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCore — My Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="../shared/api.js"></script>
    <script src="../shared/auth.js"></script>
    <script src="../shared/components.js"></script>
    <style>
        body { font-family: 'DM Sans', sans-serif; background: #0B0F1A; color: #e8eef8; }
        h1,h2,h3 { font-family: 'Syne', sans-serif; }
        .sidebar { background: #111827; border-right: 1px solid rgba(141,163,194,0.1); width: 260px; min-height: 100vh; padding: 1.5rem 1rem; display: flex; flex-direction: column; position: fixed; left: 0; top: 0; z-index: 40; }
        .sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 4px; margin-top: 2rem; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; color: #8da3c2; text-decoration: none; font-size: 14px; transition: all 0.2s; }
        .nav-item:hover { background: rgba(0,212,170,0.08); color: #e8eef8; }
        .nav-item.active { background: rgba(0,212,170,0.12); color: #00d4aa; }
        .nav-item i { width: 20px; height: 20px; }
        .logo { display: flex; align-items: center; gap: 10px; }
        .logo-icon { color: #00d4aa; width: 32px; height: 32px; }
        .logo-text { font-family: 'Syne'; font-size: 1.25rem; font-weight: 700; background: linear-gradient(135deg, #00d4aa, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .sidebar-footer { border-top: 1px solid rgba(141,163,194,0.1); padding-top: 1rem; }
        .logout-btn { color: #ef4444 !important; }
        .logout-btn:hover { background: rgba(239,68,68,0.1) !important; }
        .main-content { margin-left: 260px; padding: 2rem; }
        .glass-card { background: #131c2e; border: 1px solid rgba(141,163,194,0.08); border-radius: 1rem; }
        .input-field { background: rgba(11,15,26,0.6); border: 1px solid rgba(141,163,194,0.15); color: #e8eef8; transition: all 0.3s; }
        .input-field:focus { border-color: #00d4aa; box-shadow: 0 0 0 3px rgba(0,212,170,0.1); outline: none; }
    </style>
</head>
<body x-data="profilePage()" x-init="init()">
    <div x-html="getSidebar('patient', 'profile')"></div>
    <main class="main-content">
        <h1 class="text-2xl font-bold mb-2">My Profile</h1>
        <p class="text-[#8da3c2] text-sm mb-8">Manage your personal and medical information</p>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Personal Info -->
            <div class="glass-card p-6">
                <h2 class="font-semibold mb-4 flex items-center gap-2"><i data-lucide="user" class="w-5 h-5 text-teal-400"></i> Personal Information</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs text-[#8da3c2] mb-1">Full Name</label>
                        <p class="text-sm font-medium" x-text="user.full_name || '—'"></p>
                    </div>
                    <div>
                        <label class="block text-xs text-[#8da3c2] mb-1">Email</label>
                        <p class="text-sm" x-text="user.email || '—'"></p>
                    </div>
                    <div>
                        <label class="block text-xs text-[#8da3c2] mb-1">Phone</label>
                        <p class="text-sm" x-text="user.phone || '—'"></p>
                    </div>
                    <div>
                        <label class="block text-xs text-[#8da3c2] mb-1">ABHA ID</label>
                        <p class="text-sm font-mono text-teal-400" x-text="user.abha_id || 'Not linked'"></p>
                    </div>
                </div>
            </div>

            <!-- Medical Info (Editable) -->
            <div class="glass-card p-6">
                <h2 class="font-semibold mb-4 flex items-center gap-2"><i data-lucide="heart-pulse" class="w-5 h-5 text-red-400"></i> Medical Information</h2>
                <form @submit.prevent="saveProfile()" class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs text-[#8da3c2] mb-1">Date of Birth</label>
                            <input x-model="profile.dob" type="date" class="input-field w-full px-3 py-2 rounded-xl text-sm">
                        </div>
                        <div>
                            <label class="block text-xs text-[#8da3c2] mb-1">Gender</label>
                            <select x-model="profile.gender" class="input-field w-full px-3 py-2 rounded-xl text-sm">
                                <option value="">Select</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-[#8da3c2] mb-1">Blood Group</label>
                        <select x-model="profile.blood_group" class="input-field w-full px-3 py-2 rounded-xl text-sm">
                            <option value="">Select</option>
                            <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
                            <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-[#8da3c2] mb-1">Allergies (comma separated)</label>
                        <input x-model="allergiesStr" type="text" class="input-field w-full px-3 py-2 rounded-xl text-sm" placeholder="e.g. Penicillin, Peanuts">
                    </div>
                    <div>
                        <label class="block text-xs text-[#8da3c2] mb-1">Chronic Conditions (comma separated)</label>
                        <input x-model="conditionsStr" type="text" class="input-field w-full px-3 py-2 rounded-xl text-sm" placeholder="e.g. Diabetes, Hypertension">
                    </div>

                    <h3 class="font-medium text-sm mt-4 pt-4 border-t border-[#1e293b]">Emergency Contact</h3>
                    <div class="grid grid-cols-3 gap-3">
                        <input x-model="emergency.name" type="text" class="input-field px-3 py-2 rounded-xl text-sm" placeholder="Name">
                        <input x-model="emergency.phone" type="text" class="input-field px-3 py-2 rounded-xl text-sm" placeholder="Phone">
                        <input x-model="emergency.relation" type="text" class="input-field px-3 py-2 rounded-xl text-sm" placeholder="Relation">
                    </div>

                    <button type="submit" class="px-6 py-2.5 rounded-xl text-sm font-medium bg-teal-500 text-[#0B0F1A] hover:bg-teal-400 transition-all">Save Changes</button>
                </form>
            </div>
        </div>
    </main>
    <script>
        function profilePage() {
            return {
                user: {},
                profile: {},
                allergiesStr: '',
                conditionsStr: '',
                emergency: { name: '', phone: '', relation: '' },
                async init() {
                    guardRoute(['patient']);
                    try {
                        this.user = await apiGet('/api/auth/me');
                        const p = await apiGet('/api/patients/1');
                        this.profile = p || {};
                        this.allergiesStr = (p.allergies || []).join(', ');
                        this.conditionsStr = (p.chronic_conditions || []).join(', ');
                        this.emergency = p.emergency_contact || { name: '', phone: '', relation: '' };
                    } catch(e) { console.error(e); }
                    this.$nextTick(() => lucide.createIcons());
                },
                async saveProfile() {
                    try {
                        const data = {
                            dob: this.profile.dob,
                            gender: this.profile.gender,
                            blood_group: this.profile.blood_group,
                            allergies: this.allergiesStr.split(',').map(s => s.trim()).filter(Boolean),
                            chronic_conditions: this.conditionsStr.split(',').map(s => s.trim()).filter(Boolean),
                            emergency_contact: this.emergency
                        };
                        await apiPut(`/api/patients/${this.profile.id}`, data);
                        showToast('Profile updated!');
                    } catch(e) { showToast(e.message, 'error'); }
                }
            };
        }
    </script>
</body>
</html>
