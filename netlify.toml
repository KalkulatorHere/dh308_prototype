# netlify.toml — Tells Netlify how to deploy the frontend
[build]
  # The folder to publish (all static HTML/JS/CSS)
  publish = "frontend"

# No build command needed — it's plain HTML, no npm/webpack

# Only redirect truly missing paths (404s) back to login
# Do NOT use status=200 catch-all — that would intercept real .html files
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
